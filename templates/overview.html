            <!-- 主要内容 -->
            <div class="content">
                <div class="container-fluid">
                    <div id="heatmapContainer" style="height: 400px; margin-bottom: 50px;"></div>

    <!-- 使用与 index.html 相同的脚本引用 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/js/adminlte.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 热力矩阵图表
            Highcharts.chart('heatmapContainer', {
                chart: {
                    type: 'heatmap',
                    plotBorderWidth: 1
                },
                title: {
                    text: '分领域朝代热力矩阵'
                },
                xAxis: {
                    categories: ['汉', '唐', '宋', '元', '明', '清']
                },
                yAxis: {
                    categories: ['农业', '化学', '医学生物', '天文地理', '工程建筑', '数学计量', '物理'],
                    title: null
                },
                colorAxis: {
                    min: 0,
                    minColor: '#FFFFFF',
                    maxColor: Highcharts.getOptions().colors[0]
                },
                legend: {
                    align: 'right',
                    layout: 'vertical',
                    margin: 0,
                    verticalAlign: 'top',
                    y: 25,
                    symbolHeight: 280
                },
                tooltip: {
                    formatter: function () {
                        return `<b>${this.series.xAxis.categories[this.point.x]}</b> <br><b>${this.point.value}</b> 成就 <br><b>${this.series.yAxis.categories[this.point.y]}</b>`;
                    }
                },
                series: [{
                    name: '成就数量',
                    borderWidth: 1,
                    data: [
                        [0, 0, 10], [0, 1, 19], [0, 2, 8], [0, 3, 15], [0, 4, 12], [0, 5, 5], [0, 6, 7],
                        [1, 0, 24], [1, 1, 67], [1, 2, 16], [1, 3, 20], [1, 4, 14], [1, 5, 9], [1, 6, 10],
                        [2, 0, 23], [2, 1, 6], [2, 2, 8], [2, 3, 13], [2, 4, 11], [2, 5, 4], [2, 6, 6],
                        [3, 0, 5], [3, 1, 8], [3, 2, 12], [3, 3, 9], [3, 4, 7], [3, 5, 3], [3, 6, 5],
                        [4, 0, 15], [4, 1, 23], [4, 2, 9], [4, 3, 17], [4, 4, 13], [4, 5, 8], [4, 6, 9],
                        [5, 0, 10], [5, 1, 4], [5, 2, 6], [5, 3, 11], [5, 4, 9], [5, 5, 6], [5, 6, 8]
                    ],
                    dataLabels: {
                        enabled: true,
                        color: '#000000'
                    }
                }]
            });

            // 堆叠柱状图
            Highcharts.chart('stackedColumnContainer', {
                chart: {
                    type: 'column'
                },
                title: {
                    text: '成就类型堆叠图'
                },
                xAxis: {
                    categories: ['农业', '化学', '医学生物', '天文地理', '工程建筑', '数学计量', '物理']
                },
                yAxis: {
                    min: 0,
                    title: {
                        text: '成就数量'
                    },
                    stackLabels: {
                        enabled: true,
                        style: {
                            fontWeight: 'bold',
                            color: (Highcharts.theme && Highcharts.theme.textColor) || 'gray'
                        }
                    }
                },
                legend: {
                    align: 'right',
                    x: -30,
                    verticalAlign: 'top',
                    y: 25,
                    floating: true,
                    backgroundColor: Highcharts.defaultOptions.legend.backgroundColor || 'white',
                    borderColor: '#CCC',
                    borderWidth: 1,
                    shadow: false
                },
                tooltip: {
                    headerFormat: '<b>{point.x}</b><br/>',
                    pointFormat: '{series.name}: {point.y}<br/>Total: {point.stackTotal}'
                },
                plotOptions: {
                    column: {
                        stacking: 'normal',
                        dataLabels: {
                            enabled: true
                        }
                    }
                },
                series: [{
                    name: '理论',
                    data: [5, 3, 4, 7, 2, 1, 6]
                }, {
                    name: '技术',
                    data: [2, 2, 3, 2, 1, 1, 3]
                }, {
                    name: '仪器',
                    data: [3, 4, 4, 2, 5, 2, 4]
                }]
            });
        });
    </script>
</body>
