<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>总体概览 - 中国古代科学家知识库</title>

    <!-- 使用与 index.html 相同的样式引用 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/css/adminlte.min.css">
    <script src="https://code.highcharts.com/highcharts.js"></script>
</head>

<body class="layout-fixed sidebar-expand-lg">
    <div class="wrapper">
        <!-- Navbar -->
        <nav class="main-header navbar navbar-expand navbar-light">
            <div class="container-fluid">
                <!-- Left navbar links -->
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
                            <i class="fas fa-bars"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/index.html" class="nav-link">首页</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">关于</a>
                    </li>
                </ul>

                <!-- Right navbar links -->
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" data-lte-toggle="fullscreen" href="#" role="button">
                            <i class="fas fa-expand-arrows-alt"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main Sidebar Container -->
        <aside class="main-sidebar sidebar-bg-light">
            <div class="brand-container">
                <a href="#" class="brand-link">
                    <span class="brand-text">中国古代科学家知识库</span>
                </a>
            </div>

            <div class="sidebar">
                <nav class="mt-2">
                    <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
                        <!-- 搜索查询 (无子菜单) -->
                        <li class="nav-item">
                            <a href="#" class="nav-link" data-page="search">
                                <i class="nav-icon fas fa-search"></i>
                                <p>搜索查询</p>
                            </a>
                        </li>

                        <!-- 统计分析 (有子菜单) -->
                        <li class="nav-item has-treeview">
                            <a href="#" class="nav-link">
                                <i class="nav-icon fas fa-chart-pie"></i>
                                <p>
                                    统计分析
                                    <i class="fas fa-angle-left right"></i>
                                </p>
                            </a>
                            <ul class="nav nav-treeview">
                                <li class="nav-item">
                                    <a href="/overview" class="nav-link">
                                        <i class="far fa-circle nav-icon"></i>
                                        <p>总体概览</p>
                                    </a>
                                </li>
                                <li class="nav-item">
                                    <a href="/field-analysis" class="nav-link">
                                        <i class="far fa-circle nav-icon"></i>
                                        <p>领域分析</p>
                                    </a>
                                </li>
                                <li class="nav-item">
                                    <a href="/time-analysis" class="nav-link">
                                        <i class="far fa-circle nav-icon"></i>
                                        <p>时间分析</p>
                                    </a>
                                </li>
                            </ul>
                        </li>

                        <!-- 分类浏览 (有子菜单) -->
                        <li class="nav-item has-treeview">
                            <a href="#" class="nav-link">
                                <i class="nav-icon fas fa-th"></i>
                                <p>
                                    分类浏览
                                    <i class="fas fa-angle-left right"></i>
                                </p>
                            </a>
                            <ul class="nav nav-treeview">
                                <li class="nav-item">
                                    <a href="#" class="nav-link" data-page="agriculture">
                                        <i class="far fa-circle nav-icon"></i>
                                        <p>农业</p>
                                    </a>
                                </li>
                                <!-- ... 其他分类选项 ... -->
                            </ul>
                        </li>

                        <!-- 时间轴 (无子菜单) -->
                        <li class="nav-item">
                            <a href="#" class="nav-link" data-page="timeline">
                                <i class="nav-icon fas fa-clock"></i>
                                <p>时间轴</p>
                            </a>
                        </li>

                        <!-- 科学文萃 (无子菜单) -->
                        <li class="nav-item">
                            <a href="/articles" class="nav-link">
                                <i class="nav-icon fas fa-book"></i>
                                <p>科学文萃</p>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- Content Wrapper -->
        <div class="content-wrapper">
            <!-- 内容头部 -->
            <div class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1 class="m-0">总体概览</h1>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 主要内容 -->
            <div class="content">
                <div class="container-fluid">
                    <div class="row">
                        <!-- 左侧图表 -->
                        <div class="col-lg-6">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">各朝代科学家分布</h3>
                                </div>
                                <div class="card-body">
                                    <div id="dynastyChart" style="height: 300px;"></div>
                                </div>
                            </div>
                        </div>
                        <!-- 右侧图表 -->
                        <div class="col-lg-6">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">领域分布</h3>
                                </div>
                                <div class="card-body">
                                    <div id="categoryChart" style="height: 300px;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 页脚 -->
        {% include 'footer.html' %}
    </div>

    <!-- 使用与 index.html 相同的脚本引用 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/js/adminlte.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>

    <!-- 初始化图表的脚本 -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 获取数据并初始化图表
            fetch('/api/statistics')
                .then(response => response.json())
                .then(data => {
                    // 朝代分布图表
                    Highcharts.chart('dynastyChart', {
                        chart: { type: 'column' },
                        title: { text: '各朝代科学家分布' },
                        xAxis: {
                            categories: data.dynasties.map(d => d.name),
                            title: { text: '朝代' }
                        },
                        yAxis: {
                            title: { text: '人数' }
                        },
                        series: [{
                            name: '科学家数量',
                            data: data.dynasties.map(d => d.count)
                        }],
                        credits: {
                            enabled: false  // 禁用水印
                        }
                    });

                    // 领域分布图表
                    Highcharts.chart('categoryChart', {
                        chart: { type: 'pie' },
                        title: { text: '领域分布' },
                        series: [{
                            name: '科学家数量',
                            data: data.categories.map(c => ({
                                name: c.name,
                                y: c.y
                            }))
                        }],
                        credits: {
                            enabled: false  // 禁用水印
                        }
                    });
                })
                .catch(error => console.error('加载数据失败:', error));
        });
    </script>
</body>

</html>
