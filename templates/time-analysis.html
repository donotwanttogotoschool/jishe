                        { x: Date.UTC(-104, 0, 1), name: '西汉《太初历》实施', label: '西汉', description: '中国第一部完整历法' },
                        { x: Date.UTC(-1, 0, 1), name: '西汉《氾胜之书》', label: '西汉', description: '总结农业技术' },
                        { x: Date.UTC(132, 0, 1), name: '张衡发明地动仪', label: '东汉', description: '世界最早地震监测仪器' },
                        { x: Date.UTC(200, 0, 1), name: '华佗使用麻沸散', label: '东汉', description: '进行外科手术' },
                        { x: Date.UTC(300, 0, 1), name: '三国时期马钧改进织绫机与指南车', label: '三国', description: '' },
                        { x: Date.UTC(400, 0, 1), name: '东晋葛洪《肘后备急方》', label: '东晋', description: '记载青蒿治疗疟疾' },
                        { x: Date.UTC(500, 0, 1), name: '祖冲之计算圆周率至小数点后7位', label: '南北朝', description: '3.1415926' },
                        { x: Date.UTC(533, 0, 1), name: '北魏贾思勰《齐民要术》', label: '北魏', description: '系统总结农学技术' },

                        { x: Date.UTC(700, 0, 1), name: '唐朝孙思邈《千金方》', label: '唐朝', description: '奠定临床医学基础' },

                        { x: Date.UTC(1088, 0, 1), name: '北宋沈括《梦溪笔谈》', label: '北宋', description: '记载活字印刷、磁偏角' },
                        { x: Date.UTC(1100, 0, 1), name: '北宋毕昇发明活字印刷术', label: '北宋', description: '' },

                        { x: Date.UTC(1405, 0, 1), name: '明朝郑和船队使用航海罗盘与牵星板导航', label: '明朝', description: '' },

                        { x: Date.UTC(1637, 0, 1), name: '明朝宋应星《天工开物》', label: '明朝', description: '总结手工业技术' },
                        { x: Date.UTC(1700, 0, 1), name: '清朝《四库全书》', label: '清朝', description: '收录大量科技典籍' }
                    ]
                }]
            });

            // 点击事件触发缩放
            $('#timelineContainer').on('click', function () {
                chart.xAxis[0].setExtremes(Date.UTC(-500, 0, 1), Date.UTC(500, 0, 1));
            });

            // 领域趋势图配置
            const createFieldChart = (containerId, title, data) => {
                return Highcharts.chart(containerId, {
                    chart: {
                        type: 'area',
                        options3d: {
                            enabled: true,
                            alpha: 15,
                            beta: 15,
                            depth: 50,
                            viewDistance: 25
                        }
                    },
                    title: {
                        text: title
                    },
                    xAxis: {
                        categories: ['夏商周', '春秋战国', '秦汉', '魏晋南北朝', '隋唐', '宋', '元', '明', '清'],
                        tickmarkPlacement: 'on',
                        labels: {
                            style: {
                                color: '#8B4513'
                            }
                        }
                    },
                    yAxis: {
                        title: {
                            text: '发展指数',
                            style: {
                                color: '#8B4513'
                            }
                        }
                    },
                    tooltip: {
                        shared: true,
                        backgroundColor: 'rgba(255, 248, 220, 0.9)',
                        style: {
                            color: '#8B4513'
                        }
                    },
                    plotOptions: {
                        area: {
                            depth: 100,
                            fillOpacity: 0.7,
                            marker: {
                                enabled: true,
                                radius: 4
                            }
                        }
                    },
                    series: [{
                        name: title,
                        data: data
                    }]
                });
            };

            // 初始化各个领域的图表
            const fieldCharts = {
                'agriculture': createFieldChart('agricultureChart', '农业发展趋势', [3, 4, 7, 5, 6, 8, 6, 9, 7]),
                'chemistry': createFieldChart('chemistryChart', '化学发展趋势', [2, 5, 8, 6, 7, 9, 5, 8, 6]),
                'medicine': createFieldChart('medicineChart', '医学生物发展趋势', [4, 6, 8, 7, 8, 9, 6, 7, 8]),
                'astronomy': createFieldChart('astronomyChart', '天文地理发展趋势', [5, 7, 8, 6, 9, 8, 7, 6, 7]),
                'engineering': createFieldChart('engineeringChart', '工程建筑发展趋势', [6, 8, 9, 7, 8, 7, 5, 8, 7]),
                'mathematics': createFieldChart('mathematicsChart', '数学发展趋势', [3, 5, 7, 8, 6, 9, 7, 6, 5]),
                'physics': createFieldChart('physicsChart', '物理发展趋势', [2, 4, 6, 5, 7, 8, 6, 7, 6])
            };

            // 监听卡片关闭事件
            $('.card-tools .btn-tool').on('click', function () {
                const card = $(this).closest('.card');
                card.fadeOut(300, function () {
                    const fieldId = card.attr('id').replace('-card', '');
                    const reopenBtn = $(`<button class="btn btn-primary mb-3">重新打开${card.find('.card-title').text()}</button>`);
                    reopenBtn.on('click', function () {
                        card.fadeIn(300);
                        $(this).remove();
                    });
                    $('#fieldCards').prepend(reopenBtn);
                });
            });
        });
