    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>

    <!-- 原有的 Highcharts 初始化脚本保持不变 -->
    <script>
        // 指南针磁场分布图
        Highcharts.chart('magneticFieldChart', {
            chart: {
                type: 'vector'
            },
            title: {
                text: '司南磁场方向分布'
            },
            xAxis: {
                min: -10,
                max: 10
            },
            yAxis: {
                min: -10,
                max: 10
            },
            series: [{
                name: '磁场方向',
                data: [
                    [0, 0, 0, 5],    // 中心点
                    [5, 0, -1, 1],   // 东方
                    [-5, 0, 1, 1],   // 西方
                    [0, 5, 0, -1],   // 北方
                    [0, -5, 0, 1]    // 南方
                ],
                vectorLength: 20
            }]
        });

        // 古代物理发明时期分布
        Highcharts.chart('inventionsChart', {
            chart: {
                type: 'streamgraph'
            },
            title: {
                text: '各朝代物理发明数量分布'
            },
            xAxis: {
                categories: ['战国', '秦汉', '魏晋', '隋唐', '宋元', '明清']
            },
            series: [{
                name: '机械装置',
                data: [3, 5, 4, 7, 8, 6]
            }, {
                name: '测量工具',
                data: [2, 4, 3, 5, 6, 7]
            }, {
                name: '天文仪器',
                data: [4, 6, 5, 8, 7, 5]
            }]
        });

        // 机械原理分类
        Highcharts.chart('mechanicsChart', {
            chart: {
                type: 'column'
            },
            title: {
                text: '古代机械原理分类统计'
            },
            xAxis: {
                categories: ['杠杆', '滑轮', '齿轮', '水力', '风力']
            },
            yAxis: {
                title: {
                    text: '应用数量'
                }
            },
            series: [{
                name: '军事应用',
                data: [5, 3, 4, 2, 1]
            }, {
                name: '农业应用',
                data: [3, 4, 2, 5, 3]
            }, {
                name: '生活应用',
                data: [4, 5, 3, 4, 2]
            }]
        });
    </script>
