                    <!-- 第一行：十二经脉图和子午流注时钟 -->
                    <div class="row">
                        <!-- 十二经脉循行图 -->

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>

    <!-- Highcharts 初始化脚本 -->
    <script>
        // 十二经脉环状网络图
        Highcharts.chart('meridianChart', {
            chart: {
                type: 'networkgraph',
                backgroundColor: '#FFFFFF'
            },
            title: {
                text: '十二经脉气血循环系统'
            },
            plotOptions: {
                networkgraph: {
                    layoutAlgorithm: {
                        enableSimulation: true,
                        friction: -0.9,
                        linkLength: 100
                    }
                }
            },
            series: [{
                dataLabels: {
                    enabled: true
                },
                data: [
                    // 中心点连接所有经脉
                    ['中心', '手太阴肺经'],
                    ['中心', '手阳明大肠经'],
                    ['中心', '足阳明胃经'],
                    ['中心', '足太阴脾经'],
                    ['中心', '手少阴心经'],
                    ['中心', '手太阳小肠经'],
                    ['中心', '足太阳膀胱经'],
                    ['中心', '足少阴肾经'],
                    ['中心', '手厥阴心包经'],
                    ['中心', '手少阳三焦经'],
                    ['中心', '足少阳胆经'],
                    ['中心', '足厥阴肝经']
                ],
                nodes: [
                    { id: '中心', color: '#FF0000', marker: { radius: 20 } },
                    { id: '手太阴肺经', color: '#4169E1' },
                    { id: '手阳明大肠经', color: '#800080' },
                    { id: '足阳明胃经', color: '#FF69B4' },
                    { id: '足太阴脾经', color: '#32CD32' },
                    { id: '手少阴心经', color: '#006400' },
                    { id: '手太阳小肠经', color: '#00CED1' },
                    { id: '足太阳膀胱经', color: '#FF4500' },
                    { id: '足少阴肾经', color: '#FFD700' },
                    { id: '手厥阴心包经', color: '#FF69B4' },
                    { id: '手少阳三焦经', color: '#FF8C00' },
                    { id: '足少阳胆经', color: '#8B4513' },
                    { id: '足厥阴肝经', color: '#4B0082' }
                ]
            }]
        });

        // 四气五味分布图（饼图）
        Highcharts.chart('herbNatureChart', {
            chart: {
                type: 'pie'
            },
            title: {
                text: '本草四气五味分布'
            },
            series: [{
                name: '药物数量',
                data: [
                    { name: '寒性', y: 20, color: '#4169E1' },
                    { name: '凉性', y: 20, color: '#87CEEB' },
                    { name: '平性', y: 20, color: '#FFD700' },
                    { name: '温性', y: 20, color: '#FFA07A' },
                    { name: '热性', y: 20, color: '#FF4500' }
                ],
                innerSize: '40%'
            }]
        });

        // 归经分析（桑基图）
        Highcharts.chart('meridianSankeyChart', {
            chart: {
                type: 'sankey'
            },
            title: {
                text: '本草归经分析'
            },
            series: [{
                data: [
                    ['性味', '肝经', 50],
                    ['性味', '心经', 45],
                    ['性味', '脾经', 60],
                    ['性味', '肺经', 55],
                    ['性味', '肾经', 40],
                    ['肝经', '清热', 20],
                    ['心经', '安神', 25],
                    ['脾经', '健脾', 30],
                    ['肺经', '止咳', 25],
                    ['肾经', '补肾', 20]
                ]
            }]
        });

        // 子午流注时钟
        Highcharts.chart('flowingPointClock', {
            chart: {
                type: 'pie',
                backgroundColor: '#FFFFFF'
            },
            title: {
                text: ''
            },
            plotOptions: {
                pie: {
                    startAngle: -90,
                    endAngle: 270,
                    center: ['50%', '50%'],
                    size: '100%',
                    dataLabels: {
                        enabled: true,
                        formatter: function () {
                            return this.point.name;
                        }
                    }
                }
            },
            series: [{
                name: '经络',
                innerSize: '50%',
                data: [
                    { name: '子 (肾)', y: 8.33, color: '#FFD700' },
                    { name: '丑 (膀胱)', y: 8.33, color: '#FF4500' },
                    { name: '寅 (胆)', y: 8.33, color: '#8B4513' },
                    { name: '卯 (肝)', y: 8.33, color: '#4B0082' },
                    { name: '辰 (肺)', y: 8.33, color: '#4169E1' },
                    { name: '巳 (大肠)', y: 8.33, color: '#800080' },
                    { name: '午 (胃)', y: 8.33, color: '#FF69B4' },
                    { name: '未 (脾)', y: 8.33, color: '#32CD32' },
                    { name: '申 (心)', y: 8.33, color: '#006400' },
                    { name: '酉 (小肠)', y: 8.33, color: '#00CED1' },
                    { name: '戌 (心包)', y: 8.33, color: '#FF69B4' },
                    { name: '亥 (三焦)', y: 8.33, color: '#FF8C00' }
                ]
            }]
        });

        // 更新当前经络显示
        function updateCurrentMeridian() {
            const hour = new Date().getHours();
            const meridians = [
                '子时 (23-1点) - 肾经当令',
                '丑时 (1-3点) - 膀胱经当令',
                '寅时 (3-5点) - 胆经当令',
                '卯时 (5-7点) - 肝经当令',
                '辰时 (7-9点) - 肺经当令',
                '巳时 (9-11点) - 大肠经当令',
                '午时 (11-13点) - 胃经当令',
                '未时 (13-15点) - 脾经当令',
                '申时 (15-17点) - 心经当令',
                '酉时 (17-19点) - 小肠经当令',
                '戌时 (19-21点) - 心包经当令',
                '亥时 (21-23点) - 三焦经当令'
            ];

            const index = Math.floor(((hour + 1) % 24) / 2);
            document.getElementById('currentMeridian').textContent = meridians[index];
        }

        updateCurrentMeridian();
        setInterval(updateCurrentMeridian, 60000);
    </script>
</body>
