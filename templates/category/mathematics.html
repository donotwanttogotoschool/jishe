                    x: Date.UTC(-500, 0, 1),
                    name: '周髀算经',
                    description: '最早的数学著作之一'
                }, {
                    x: Date.UTC(100, 0, 1),
                    name: '九章算术',
                    description: '系统性数学著作'
                }, {
                    x: Date.UTC(263, 0, 1),
                    name: '刘徽注九章算术',
