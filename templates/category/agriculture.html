    <!-- Highcharts 初始化脚本 -->
    <script>
        // 设置 Highcharts 全局配置
        Highcharts.setOptions({
            // 语言设置
            lang: {
                viewFullscreen: '全屏查看',
                printChart: '打印图表',
                downloadPNG: '下载 PNG 图片',
                downloadJPEG: '下载 JPEG 图片',
                downloadSVG: '下载 SVG 矢量图',
                downloadPDF: '下载 PDF 文档',
                downloadCSV: '下载 CSV 文件',
                downloadXLS: '下载 XLS 文件',
                contextButtonTitle: '图表导出菜单'
            },
            // 移除 Highcharts.com 水印
            credits: {
                enabled: false
            }
        });

        // 1. 农学科学理论体系
        Highcharts.chart('scienceTheoryChart', {
            chart: {
                polar: true,
                type: 'line'
            },
            title: {
                text: '古代农学自然科学理论体系分析'
            },
            subtitle: {
                text: '基于古代农书的自然科学分支研究程度'
            },
            pane: {
                size: '80%'
            },
            xAxis: {
                categories: ['土壤分类学', '物候观测', '生态轮作', '植物生理', '农具力学'],
                tickmarkPlacement: 'on',
                lineWidth: 0
            },
            yAxis: {
                gridLineInterpolation: 'polygon',
                lineWidth: 0,
                min: 0,
                max: 10
            },
            tooltip: {
                shared: true,
                pointFormat: '<span style="color:{series.color}">{series.name}: <b>{point.y:,.0f}/10</b><br/>'
            },
            series: [{
                name: '齐民要术',
                data: [9, 8, 7, 6, 5],
                pointPlacement: 'on'
            }, {
                name: '农政全书',
                data: [7, 6, 8, 9, 7],
                pointPlacement: 'on'
            }, {
                name: '王祯农书',
                data: [6, 5, 7, 8, 10],
                pointPlacement: 'on'
            }]
        });

        // 2. 物候观测与天文历法
        Highcharts.chart('astronomyChart', {
            chart: {
                type: 'column'
            },
            title: {
                text: '物候观测与天文历法关系'
            },
            subtitle: {
                text: '基于古代天文-农业观测系统'
            },
            xAxis: {
                categories: ['圭表测日影', '二十四节气', '授时历', '农时校正']
            },
            yAxis: {
                title: {
                    text: '观测精确度 (相对单位)'
                }
            },
            series: [{
                name: '观测准确度',
                data: [8, 9, 7, 10]
            }, {
                name: '应用频率',
                data: [6, 9, 8, 7]
            }]
        });

        // 3. 农业测量工具演进
        Highcharts.chart('toolsChart', {
            chart: {
                type: 'line'
            },
            title: {
                text: '古代农业测量工具演进'
            },
            subtitle: {
                text: '测量精度与科学原理发展'
            },
            xAxis: {
                categories: ['汉代', '唐代', '宋代', '明代']
            },
            yAxis: {
                title: {
                    text: '测量精度 (相对单位)'
                }
            },
            series: [{
                name: '测量工具精度',
                data: [3, 5, 7, 8],
                dataLabels: {
                    enabled: true,
                    format: '{point.name}'
                }
            }]
        });

        // 4. 蝗虫生物习性研究
        Highcharts.chart('locustChart', {
            chart: {
                type: 'scatter'
            },
            title: {
                text: '古代蝗虫生物学研究数据'
            },
            subtitle: {
                text: '基于历代农书记载的观测数据'
            },
            xAxis: {
                title: {
                    text: '产卵深度（寸）'
                }
            },
            yAxis: {
                title: {
                    text: '孵化温度（℃）'
                }
            },
            series: [{
                name: '观测记录',
                data: [
                    [2, 18], [3, 25], [4, 30], [5, 35],
                    [2.5, 20], [3.5, 28], [4.5, 32]
                ]
            }]
        });

        // 5. 水利工程流体力学
        Highcharts.chart('hydraulicsChart', {
            chart: {
                type: 'area'
            },
            title: {
                text: '古代水利工程流体力学原理'
            },
            subtitle: {
                text: '基于都江堰与龙首渠设计数据'
            },
            xAxis: {
                categories: ['入口', '分流点', '主渠道', '支渠道', '出口'],
                title: {
                    text: '水流位置'
                }
            },
            yAxis: {
                title: {
                    text: '水流速度 (相对单位)'
                }
            },
            series: [{
                name: '都江堰水流速度',
                data: [5, 8, 6, 4, 3]
            }, {
                name: '龙首渠水流速度',
                data: [4, 7, 5, 3, 2]
            }]
        });

        // 6. 作物育种实验
        Highcharts.chart('breedingChart', {
            chart: {
                type: 'bubble'
            },
            title: {
                text: '古代作物育种理论体系'
            },
            subtitle: {
                text: '基于历代农书记载的育种实验'
            },
            xAxis: {
                categories: ['汉代', '唐代', '宋代', '明代', '清代'],
                title: {
                    text: '时期'
                }
            },
            yAxis: {
                title: {
                    text: '技术复杂度'
                }
            },
            series: [{
                name: '育种技术',
                data: [
                    [0, 5, 10], // [x, y, bubble size]
                    [1, 6, 15],
                    [2, 8, 20],
                    [3, 7, 12],
                    [4, 9, 18]
                ]
            }]
        });
    </script>
