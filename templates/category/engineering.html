    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>

    <!-- 保持原有的图表初始化脚本不变 -->
    <script>
        // 都江堰水利系统3D结构图
        Highcharts.chart('dujiangyanChart', {
            chart: {
                type: 'scatter3d',
                options3d: {
                    enabled: true,
                    alpha: 20,
                    beta: 30,
                    depth: 200,
                    viewDistance: 5
                }
            },
            title: {
                text: '都江堰水利系统主要构件分布'
            },
            subtitle: {
                text: '鱼嘴、飞沙堰、宝瓶口等核心工程'
            },
            plotOptions: {
                scatter: {
                    marker: {
                        radius: 5
                    }
                }
            },
            series: [{
                name: '主要工程构件',
                data: [
                    [1, 1, 1], // 鱼嘴
                    [2, 3, 2], // 飞沙堰
                    [3, 2, 3], // 宝瓶口
                    [4, 1, 2]  // 内外金沙堰
                ]
            }]
        });

        // 古代建筑类型统计
        Highcharts.chart('buildingTypeChart', {
            chart: {
                type: 'pie',
                options3d: {
                    enabled: true,
                    alpha: 45
                }
            },
            title: {
                text: '古代建筑类型分布'
            },
            plotOptions: {
                pie: {
                    innerSize: 100,
                    depth: 45
                }
            },
            series: [{
                name: '建筑数量',
                data: [
                    ['宫殿建筑', 25],
                    ['宗教建筑', 20],
                    ['民居建筑', 30],
                    ['园林建筑', 15],
                    ['军事建筑', 10]
                ]
            }]
        });

        // 长城建造技术演进
        Highcharts.chart('greatWallChart', {
            chart: {
                type: 'timeline'
            },
            title: {
                text: '长城建造技术演进'
            },
            xAxis: {
                type: 'datetime'
            },
            series: [{
                data: [{
                    x: Date.UTC(-700, 0, 1),
                    name: '春秋战国',
                    label: '夯土墙',
                    description: '以土为主要材料'
                }, {
                    x: Date.UTC(-200, 0, 1),
                    name: '秦朝',
                    label: '石块加固',
                    description: '开始使用石材'
                }, {
                    x: Date.UTC(1400, 0, 1),
                    name: '明朝',
                    label: '砖石结构',
                    description: '砖石混合建造'
                }]
            }]
        });
    </script>
