                        <!-- 二十八宿星图 -->
                        <div class="col-12">

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/js/adminlte.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>

    <!-- Highcharts 初始化脚本 -->
    <script>
        // 设置 Highcharts 全局配置
        Highcharts.setOptions({
            lang: {
                viewFullscreen: '全屏查看',
                printChart: '打印图表',
                downloadPNG: '下载 PNG 图片',
                downloadJPEG: '下载 JPEG 图片',
                downloadSVG: '下载 SVG 矢量图',
                downloadPDF: '下载 PDF 文档',
                downloadCSV: '下载 CSV 文件',
                downloadXLS: '下载 XLS 文件',
                contextButtonTitle: '图表导出菜单'
            },
            credits: {
                enabled: false
            }
        });

        // 1. 星官体系三维天球仪（使用极坐标散点图模拟）
        Highcharts.chart('constellationChart', {
            chart: {
                polar: true,
                type: 'scatter'
            },
            title: {
                text: '三垣二十八宿天文系统'
            },
            subtitle: {
                text: '基于《开元占经》星官坐标'
            },
            pane: {
                startAngle: 0,
                endAngle: 360
            },
            xAxis: {
                tickInterval: 45,
                min: 0,
                max: 360,
                labels: {
                    formatter: function () {
                        return this.value + '°';
                    }
                }
            },
            yAxis: {
                min: 0
            },
            plotOptions: {
                scatter: {
                    marker: {
                        radius: 5,
                        states: {
                            hover: {
                                enabled: true,
                                lineColor: 'rgb(100,100,100)'
                            }
                        }
                    },
                    states: {
                        hover: {
                            marker: {
                                enabled: false
                            }
                        }
                    },
                    tooltip: {
                        headerFormat: '<b>{series.name}</b><br>',
                        pointFormat: '赤经: {point.x}°<br>赤纬: {point.y}°'
                    }
                }
            },
            series: [{
                name: '紫微垣',
                data: [[0, 85], [45, 82], [90, 84], [135, 83]],
                color: '#9370DB'
            }, {
                name: '太微垣',
                data: [[180, 75], [225, 73], [270, 74]],
                color: '#4169E1'
            }, {
                name: '天市垣',
                data: [[315, 70], [360, 72]],
                color: '#1E90FF'
            }]
        });

        // 2. 历法演变时间线
        Highcharts.chart('calendarChart', {
            chart: {
                type: 'timeline'
            },
            title: {
                text: '中国古代历法发展史'
            },
            subtitle: {
                text: '基于历代天文典籍记载'
            },
            xAxis: {
                type: 'datetime',
                visible: false
            },
            yAxis: {
                gridLineWidth: 1,
                title: null,
                labels: {
                    enabled: false
                }
            },
            series: [{
                dataLabels: {
                    allowOverlap: false,
                    format: '<span style="color:{point.color}">● </span><span style="font-weight: bold;" > ' +
                        '{point.x:%d %b %Y}</span><br/>{point.label}'
                },
                marker: {
                    symbol: 'circle'
                },
                data: [{
                    x: Date.UTC(-2100, 0, 1),
                    name: '黄帝历',
                    label: '最早的历法系统',
                    description: '确立二十四节气'
                }, {
                    x: Date.UTC(-1600, 0, 1),
                    name: '夏历',
                    label: '建立岁首制度',
                    description: '以冬至为历年起点'
                }, {
                    x: Date.UTC(-104, 0, 1),
                    name: '太初历',
                    label: '汉武帝时期',
                    description: '首次精确测定回归年长度'
                }, {
                    x: Date.UTC(724, 0, 1),
                    name: '大衍历',
                    label: '唐玄宗时期',
                    description: '完善闰月推算方法'
                }]
            }]
        });

        // 3. 古代测绘精度分析
        Highcharts.chart('mappingChart', {
            chart: {
                type: 'column'
            },
            title: {
                text: '古代地理测绘技术进步'
            },
            subtitle: {
                text: '基于《水经注》与实际地理数据对比'
            },
            xAxis: {
                categories: ['汉代', '魏晋', '隋唐', '宋元', '明清'],
                crosshair: true
            },
            yAxis: [{
                min: 0,
                title: {
                    text: '测量精度 (%)'
                }
            }, {
                title: {
                    text: '测量工具数量'
                },
                opposite: true
            }],
            tooltip: {
                headerFormat: '<span style="font-size:10px">{point.key}</span><table>',
                pointFormat: '<tr><td style="color:{series.color};padding:0">{series.name}: </td>' +
                    '<td style="padding:0"><b>{point.y:.1f}</b></td></tr>',
                footerFormat: '</table>',
                shared: true,
                useHTML: true
            },
            plotOptions: {
                column: {
                    pointPadding: 0.2,
                    borderWidth: 0
                }
            },
            series: [{
                name: '经度测量精度',
                data: [65.3, 70.2, 78.5, 85.7, 92.1]
            }, {
                name: '纬度测量精度',
                data: [68.7, 72.4, 80.1, 87.3, 93.5]
            }, {
                name: '测量工具数量',
                yAxis: 1,
                type: 'spline',
                data: [3, 5, 8, 12, 15]
            }]
        });
    </script>
