<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广东省古代科技文化数据大屏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: "楷体", KaiTi, Arial, sans-serif;
            background: #fef8ef; // 使用vintage主题的背景色
            color: #333333;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 80px 1fr 1fr;
            height: 100vh;
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(254, 248, 239, 0.9); // 略微透明的vintage背景色
        }

        .title {
            grid-column: 1 / 5;
            grid-row: 1;
            text-align: center;
            font-size: 36px;
            color: #724e58; // vintage主题的深色
            text-shadow: 2px 2px 4px rgba(215, 171, 130, 0.3);
            margin: 0;
            padding: 20px 0;
            background: rgba(215, 171, 130, 0.1);
            border-radius: 10px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title-icons {
            position: absolute;
            right: 20px;
            display: flex;
            gap: 15px;
        }

        .title-icon {
            color: #724e58;
            opacity: 0.8;
            font-size: 24px;
            transition: all 0.3s ease;
        }

        .title-icon:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .home-button {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            padding: 8px 20px;
            background: rgba(215, 171, 130, 0.3);
            border: 1px solid #d7ab82;
            border-radius: 5px;
            color: #724e58;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: "楷体", KaiTi, Arial, sans-serif;
        }

        .home-button:hover {
            background: rgba(215, 171, 130, 0.4);
            box-shadow: 0 2px 4px rgba(215, 171, 130, 0.3);
        }

        .panel {
            position: relative;
            background: rgba(255, 252, 248, 0.8); // 更浅的vintage色调
            border: 1px solid #d7ab82; // 使用vintage主题的边框色
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
            min-height: 0;
            min-width: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(215, 171, 130, 0.2); // vintage风格阴影
        }

        .map-container {
            grid-column: 2 / 4;
            grid-row: 2;
        }

        #map {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100% !important;
            height: calc(100% - 30px) !important;
        }

        .chart-title {
            font-size: 18px;
            color: #724e58;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 1px solid #d7ab82;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 10px 15px;
            background: rgba(215, 171, 130, 0.1);
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        #timelineChart,
        #pieChart,
        #barChart,
        #scatterChart,
        #trendChart,
        #statsChart,
        #heritageChart,
        #periodChart,
        #typeChart {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100% !important;
            height: calc(100% - 30px) !important;
        }

        .left-top {
            grid-column: 1;
            grid-row: 2;
        }

        .right-top {
            grid-column: 4;
            grid-row: 2;
        }

        .left-bottom {
            grid-column: 1;
            grid-row: 3;
        }

        .bottom-left {
            grid-column: 2;
            grid-row: 3;
        }

        .bottom-right {
            grid-column: 3;
            grid-row: 3;
        }

        .right-bottom {
            grid-column: 4;
            grid-row: 3;
        }

        #rankingList,
        #dataTable,
        #trendChart {
            position: absolute;
            top: 40px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            overflow: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            color: #333333;
        }

        .data-table th,
        .data-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid rgba(215, 171, 130, 0.3);
        }

        .data-table th {
            background: rgba(215, 171, 130, 0.2);
            position: sticky;
            top: 0;
            color: #724e58;
        }

        .data-table thead {
            background: #f8f8f8;
            position: sticky;
            top: 0;
            z-index: 2; /* 确保表头在最上层 */
        }

        .chart-container {
            position: absolute;
            top: 50px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">
            <a href="../index.html" class="home-button">返回首页</a>
            <span>广东省古代自然科学文化数据大屏</span>
            <div class="title-icons">
                <i class="title-icon fas fa-book-open"></i>
                <i class="title-icon fas fa-microscope"></i>
                <i class="title-icon fas fa-flask"></i>
                <i class="title-icon fas fa-compass"></i>
            </div>
        </div>

        <!-- 左上角面板：时间轴 -->
        <div class="panel left-top">
            <div class="chart-title">历史科技成就时间轴</div>
            <div class="chart-container">
                <div id="timelineChart"></div>
            </div>
        </div>

        <!-- 中间地图 -->
        <div class="panel map-container">
            <div class="chart-title">广东省地图</div>
            <div class="chart-container">
                <div id="map"></div>
            </div>
        </div>

        <!-- 右上角面板：柱状图 -->
        <div class="panel right-top">
            <div class="chart-title">各地区科技发展指数</div>
            <div class="chart-container">
                <div id="barChart"></div>
            </div>
        </div>

        <!-- 左下角面板：饼图 -->
        <div class="panel left-bottom">
            <div class="chart-title">科技文化分布</div>
            <div class="chart-container">
                <div id="pieChart"></div>
            </div>
        </div>

        <!-- 中间下方左侧面板：散点图 -->
        <div class="panel bottom-left">
            <div class="chart-title">科技成就分布</div>
            <div class="chart-container">
                <div id="scatterChart"></div>
            </div>
        </div>

        <!-- 中间下方右侧面板：趋势图 -->
        <div class="panel bottom-right">
            <div class="chart-title">科学文化区域分布图</div>
            <div class="chart-container">
                <div id="trendChart"></div>
            </div>
        </div>

        <!-- 右下角面板：排名列表 -->
        <div class="panel right-bottom">
            <div class="chart-title">科技成就排名</div>
            <div id="rankingList">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>排名</th>
                            <th>成就名称</th>
                            <th>影响力</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>南越国木构水闸遗址</td>
                            <td>9.0</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>龙腹陂</td>
                            <td>8.5</td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>潮州陶瓷烧制业</td>
                            <td>8.0</td>
                        </tr>
                        <tr>
                            <td>4</td>
                            <td>潮州农业耕作制度</td>
                            <td>7.5</td>
                        </tr>
                        <tr>
                            <td>5</td>
                            <td>广州 2000 年古井净水技术</td>

                        <tr>

                            <td>潮州造船业</td>

                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.3.2/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
    <!-- 删除原来的广东省地图 -->

    <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=a8dad1da6df32d5e626e8ddcc8a1a7de"></script>

    <script>
        // 定义vintage主题的调色板
        const colorPalette = [
            '#d87c7c',
            '#919e8b',
            '#d7ab82',
            '#6e7074',
            '#61a0a8',
            '#efa18d',
            '#787464',
            '#cc7e63',
            '#724e58',
            '#4b565b'
        ];

        // 初始化所有图表
        const timelineChart = echarts.init(document.getElementById('timelineChart'));
        const pieChart = echarts.init(document.getElementById('pieChart'));
        const barChart = echarts.init(document.getElementById('barChart'));
        const scatterChart = echarts.init(document.getElementById('scatterChart'));
        const trendChart = echarts.init(document.getElementById('trendChart'));

        // 初始化高德地图
        let amap = new AMap.Map('map', {
            zoom: 7.5, // 缩放级别
            center: [113.280637, 23.125178], // 广东省中心点
            resizeEnable: true, // 允许调整大小
            viewMode: '3D', // 使用3D视图
            pitch: 35, // 俯仰角度

            showIndoorMap: false, // 不显示室内地图
            features: ['bg', 'road'], // 只显示背景和道路
            showBuildingBlock: false // 不显示建筑物
        });
        
        // 创建广东省行政区实例
        AMap.plugin('AMap.DistrictLayer', function() {
            // 创建行政区图层
            let guangdongLayer = new AMap.DistrictLayer.Province({
                zIndex: 12,
                adcode: ['440000'], // 广东省行政编码
                depth: 2, // 显示市级行政区
                styles: {
                    'fill': 'rgba(254, 248, 239, 0.6)', // 填充颜色
                    'province-stroke': '#d7ab82', // 省边界颜色
                    'city-stroke': 'rgba(215, 171, 130, 0.5)', // 市边界颜色
                    'county-stroke': 'rgba(215, 171, 130, 0.2)' // 区县边界颜色
                }
            });
            
            // 添加行政区图层到地图
            guangdongLayer.setMap(amap);
            
            // 添加地市标记
            const cities = [
                { name: '广州市', location: [113.280637, 23.125178], value: 980 },
                { name: '深圳市', location: [114.085947, 22.547], value: 970 },
                { name: '佛山市', location: [113.122717, 23.028762], value: 850 },
                { name: '东莞市', location: [113.746262, 23.046237], value: 830 },
                { name: '珠海市', location: [113.553986, 22.224979], value: 800 },
                { name: '惠州市', location: [114.412599, 23.079404], value: 750 },
                { name: '中山市', location: [113.382391, 22.521113], value: 730 },
                { name: '江门市', location: [113.094942, 22.590431], value: 700 },
                { name: '肇庆市', location: [112.472529, 23.051546], value: 680 },
                { name: '汕头市', location: [116.708463, 23.37102], value: 650 },
                { name: '湛江市', location: [110.364977, 21.274898], value: 630 },
                { name: '茂名市', location: [110.919229, 21.659751], value: 600 },
                { name: '揭阳市', location: [116.355733, 23.543778], value: 580 },
                { name: '清远市', location: [113.051227, 23.685022], value: 550 },
                { name: '韶关市', location: [113.591544, 24.801322], value: 520 },
                { name: '阳江市', location: [111.975107, 21.859222], value: 500 },
                { name: '潮州市', location: [116.632301, 23.661701], value: 480 },
                { name: '云浮市', location: [112.044439, 22.929801], value: 450 }
            ];
            
            // 城市科技信息
            let scienceInfo = {
                '广州市': '省会城市，经济、科技、教育中心，交通枢纽',
                '深圳市': '创新科技中心，高新技术产业密集，人才集聚',
                '佛山市': '制造业基地，传统工艺与现代技术融合',
                '东莞市': '电子信息产业基地，制造业中心',
                '珠海市': '海洋科技发展重镇，航空航天产业基地',
                '惠州市': '石油化工和电子信息产业发达',
                '中山市': '家电和照明产业发达，小家电研发中心',
                '江门市': '五金机械和纺织服装产业发达',
                '肇庆市': '新材料和汽车零部件产业集中',
                '汕头市': '潮汕文化中心，轻工业和食品加工发达',
                '湛江市': '海洋资源丰富，海洋科技发展迅速',
                '茂名市': '石油化工业发达，能源基地',
                '揭阳市': '五金和塑料产业集中，轻工业发达',
                '清远市': '生态农业发达，矿产资源丰富',
                '韶关市': '钢铁工业基地，矿产资源丰富',
                '阳江市': '五金刀剪产业发达，海洋资源丰富',
                '潮州市': '陶瓷产业发达，传统工艺保存完好',
                '云浮市': '石材产业发达，非金属矿产资源丰富'
            };
            
            // 为每个城市添加标记
            cities.forEach(city => {
                // 创建标记
                let marker = new AMap.Marker({
                    position: city.location,
                    title: city.name,
                    label: {
                        content: city.name,
                        direction: 'top',
                        offset: new AMap.Pixel(0, -5),
                        style: {
                            color: '#724e58',
                            fontSize: '12px',
                            fontWeight: 'bold',
                            padding: '3px 6px',
                            backgroundColor: 'rgba(254, 248, 239, 0.8)',
                            borderRadius: '3px'
                        }
                    },
                    icon: new AMap.Icon({
                        size: new AMap.Size(20, 20),
                        image: 'https://webapi.amap.com/theme/v1.3/markers/n/mark_r.png',
                        imageSize: new AMap.Size(20, 20)
                    })
                });
                
                // 创建信息窗体
                let infoWindow = new AMap.InfoWindow({
                    content: `<div style="padding:10px;font-family:'楷体',KaiTi;">
                                <h3 style="margin:0;color:#724e58;">${city.name}</h3>
                                <p style="margin:5px 0;">发展指数：${city.value}</p>
                                <p style="margin:5px 0;">${scienceInfo[city.name] || ''}</p>
                             </div>`,
                    offset: new AMap.Pixel(0, -30)
                });
                
                // 点击标记时打开信息窗体
                marker.on('click', function() {
                    infoWindow.open(amap, marker.getPosition());
                });
                
                amap.add(marker);
            });
            
            // 设置地图显示范围为广东省
            amap.setCity('广东省');
        });
        
        // 添加适合的控件
        amap.plugin(['AMap.Scale'], function() {
            amap.addControl(new AMap.Scale());
        });

        // 修改时间轴配置

            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'cross',
                    label: {
                        backgroundColor: '#724e58'
                    }
                }
            },
            legend: {
                data: ['农学', '医学', '数学', '工程技术'],
                top: '-2%',
                right: '10%',
                itemWidth: 10,        // 减小宽度使其成为圆点
                itemHeight: 10,       // 保持相同的高度使其成为圆形
                itemStyle: {
                    borderRadius: 5   // 设置为宽度/高度的一半，使其成为完美的圆
                },
                itemGap: 16,
                textStyle: {
                    color: '#724e58',
                    fontSize: 14,
                    padding: [3, 0, 0, 0]
                }
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                top: '15%',
                containLabel: true
            },
            xAxis: [{
                type: 'category',
                boundaryGap: false,
                data: ['夏', '商', '周', '秦', '汉', '唐', '宋'],
                axisLabel: {
                    color: '#724e58'
                },
                axisLine: {
                    lineStyle: {
                        color: '#724e58'
                    }
                }
            }],
            yAxis: [{
                type: 'value',
                name: '',  // 移除y轴名称
                interval: 100,  // 设置刻度间隔为100
                max: 200,      // 设置最大值为200
                axisLabel: {
                    color: '#724e58',
                    formatter: function (value) {
                        // 只显示100和200的刻度值
                        return value === 100 || value === 200 ? value : '';
                    }
                },
                axisLine: {
                    lineStyle: {
                        color: '#724e58'
                    }
                },
                splitLine: {
                    lineStyle: {
                        color: 'rgba(114, 78, 88, 0.1)',
                        type: 'dashed'
                    }
                }
            }],
            series: [
                {
                    name: '农学',
                    type: 'line',
                    stack: '总量',
                    smooth: true,
                    showSymbol: false,  // 隐藏数据点
                    areaStyle: {
                        color: colorPalette[1],
                        opacity: 1
                    },
                    data: [24, 21, 23, 27, 31, 34, 32],
                    itemStyle: {
                        color: colorPalette[1],
                        borderRadius: 10
                    }
                },
                {
                    name: '医学',
                    type: 'line',
                    stack: '总量',
                    smooth: true,
                    showSymbol: false,  // 隐藏数据点
                    areaStyle: {
                        color: colorPalette[2],
                        opacity: 1
                    },
                    data: [19, 25, 22, 18, 23, 37, 44],
                    itemStyle: {
                        color: colorPalette[2],
                        borderRadius: 10
                    }
                },
                {
                    name: '数学',
                    type: 'line',
                    stack: '总量',
                    smooth: true,
                    showSymbol: false,  // 隐藏数据点
                    areaStyle: {

                    },
                    data: [34, 37, 33, 36, 41, 39, 35],
                    itemStyle: {

                    }
                },
                {
                    name: '工程技术',
                    type: 'line',
                    stack: '总量',
                    smooth: true,
                    showSymbol: false,  // 隐藏数据点
                    areaStyle: {
                        color: colorPalette[4],
                        opacity: 1
                    },
                    data: [64, 76, 73, 77, 104, 97, 69],
                    itemStyle: {
                        color: colorPalette[4],
                        borderRadius: 10
                    }
                }
            ]
        };

        // 修改饼图配置
        const pieOption = {
            tooltip: {
                trigger: 'item'
            },
            series: [{
                type: 'pie',
                radius: '70%',
                data: [
                    { value: 50, name: '医药科技' },
                    { value: 25, name: '天文科技' },
                    { value: 35, name: '农业科技' },
                    { value: 40, name: '工程技术' }
                ],
                label: {
                    color: '#724e58'
                },
                color: colorPalette
            }]
        };

        // 修改柱状图配置
        const barOption = {
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'shadow'
                },
                position: function (point, params, dom, rect, size) {
                    // 限制tooltip显示在图表的右上角区域
                    return ['50%', '10%'];  // 固定在右上角区域
                },
                extraCssText: 'z-index: 100000 !important; pointer-events: all !important;'
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                top: '15%',  // 增加顶部间距，给tooltip留出更多空间
                containLabel: true
            },
            legend: {
                data: ['天文学', '农学', '医学', '地理学', '工程技术'],
                textStyle: {
                    color: '#724e58'
                }
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            xAxis: {
                type: 'value',
                axisLabel: {
                    formatter: '{value} 分',
                    color: '#724e58'
                },
                axisLine: {
                    lineStyle: {
                        color: '#724e58'
                    }
                }
            },
            yAxis: {
                type: 'category',
                data: ['广州市', '深圳市', '佛山市', '东莞市', '珠海市', '惠州市', '中山市','江门市'],
                axisLabel: {
                    color: '#724e58'
                },
                axisLine: {
                    lineStyle: {
                        color: '#724e58'
                    }
                }
            },
            series: [
                {
                    name: '天文学',
                    type: 'bar',
                    stack: 'total',

            let timeout;
            return function () {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, arguments), wait);
            };
