<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广西省古代科技文化数据大屏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: "楷体", KaiTi, Arial, sans-serif;
            background: #fef8ef; // 使用vintage主题的背景色
            color: #333333;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 80px 1fr 1fr;
            height: 100vh;
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(254, 248, 239, 0.9); // 略微透明的vintage背景色
        }

        .title {
            grid-column: 1 / 5;
            grid-row: 1;
            text-align: center;
            font-size: 36px;
            color: #724e58; // vintage主题的深色
            text-shadow: 2px 2px 4px rgba(215, 171, 130, 0.3);
            margin: 0;
            padding: 20px 0;
            background: rgba(215, 171, 130, 0.1);
            border-radius: 10px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title-icons {
            position: absolute;
            right: 20px;
            display: flex;
            gap: 15px;
        }

        .title-icon {
            color: #724e58;
            opacity: 0.8;
            font-size: 24px;
            transition: all 0.3s ease;
        }

        .title-icon:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .home-button {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            padding: 8px 20px;
            background: rgba(215, 171, 130, 0.3);
            border: 1px solid #d7ab82;
            border-radius: 5px;
            color: #724e58;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: "楷体", KaiTi, Arial, sans-serif;
        }

        .home-button:hover {
            background: rgba(215, 171, 130, 0.4);
            box-shadow: 0 2px 4px rgba(215, 171, 130, 0.3);
        }

        .panel {
            position: relative;
            background: rgba(255, 252, 248, 0.8); // 更浅的vintage色调
            border: 1px solid #d7ab82; // 使用vintage主题的边框色
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
            min-height: 0;
            min-width: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(215, 171, 130, 0.2); // vintage风格阴影
        }

        .map-container {
            grid-column: 2 / 4;
            grid-row: 2;
        }

        #map {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100% !important;
            height: calc(100% - 30px) !important;
        }

        .chart-title {
            font-size: 18px;
            color: #724e58;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 1px solid #d7ab82;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 10px 15px;
            background: rgba(215, 171, 130, 0.1);
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        #timelineChart,
        #pieChart,
        #barChart,
        #scatterChart,
        #trendChart,
        #statsChart,
        #heritageChart,
        #periodChart,
        #typeChart {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100% !important;
            height: calc(100% - 30px) !important;
        }

        .left-top {
            grid-column: 1;
            grid-row: 2;
        }

        .right-top {
            grid-column: 4;
            grid-row: 2;
        }

        .left-bottom {
            grid-column: 1;
            grid-row: 3;
        }

        .bottom-left {
            grid-column: 2;
            grid-row: 3;
        }

        .bottom-right {
            grid-column: 3;
            grid-row: 3;
        }

        .right-bottom {
            grid-column: 4;
            grid-row: 3;
        }

        #rankingList,
        #dataTable,
        #trendChart {
            position: absolute;
            top: 40px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            overflow: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            color: #333333;
        }

        .data-table th,
        .data-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid rgba(215, 171, 130, 0.3);
        }

        .data-table th {
            background: rgba(215, 171, 130, 0.2);
            position: sticky;
            top: 0;
            color: #724e58;
        }

        .data-table thead {
            background: #f8f8f8;
            position: sticky;
            top: 0;
            z-index: 2; /* 确保表头在最上层 */
        }

        .chart-container {
            position: absolute;
            top: 50px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">
            <a href="../index_achievement.html" class="home-button">返回首页</a>
            <span>广西省古代自然科学文化数据大屏</span>
            <div class="title-icons">
                <i class="title-icon fas fa-book-open"></i>
                <i class="title-icon fas fa-microscope"></i>
                <i class="title-icon fas fa-flask"></i>
                <i class="title-icon fas fa-compass"></i>
            </div>
        </div>

        <!-- 左上角面板：时间轴 -->
        <div class="panel left-top">

            <div class="chart-container">
                <div id="timelineChart"></div>
            </div>
        </div>

        <!-- 中间地图 -->
        <div class="panel map-container">
            <div class="chart-title">广西省地图</div>
            <div class="chart-container">
                <div id="map"></div>
            </div>
        </div>

        <!-- 右上角面板：柱状图 -->
        <div class="panel right-top">
            <div class="chart-title">各地区科技发展指数</div>
            <div class="chart-container">
                <div id="barChart"></div>
            </div>
        </div>

        <!-- 左下角面板：饼图 -->
        <div class="panel left-bottom">
            <div class="chart-title">科技文化分布</div>
            <div class="chart-container">
                <div id="pieChart"></div>
            </div>
        </div>

        <!-- 中间下方左侧面板：散点图 -->
        <div class="panel bottom-left">
            <div class="chart-title">科技成就分布</div>
            <div class="chart-container">
                <div id="scatterChart"></div>
            </div>
        </div>

        <!-- 中间下方右侧面板：趋势图 -->
        <div class="panel bottom-right">
            <div class="chart-title">科学文化区域分布图</div>
            <div class="chart-container">
                <div id="trendChart"></div>
            </div>
        </div>

        <!-- 右下角面板：排名列表 -->
        <div class="panel right-bottom">
            <div class="chart-title">科技成就排名</div>
            <div id="rankingList">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>排名</th>
                            <th>成就名称</th>
                            <th>影响力</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>甑皮岩遗址的制陶技术</td>
                            <td>9.0</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>合浦汉墓群的铜凤灯</td>
                            <td>8.5</td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>清代的水利综合技术</td>
                            <td>8.0</td>
                        </tr>
                        <tr>
                            <td>4</td>
                            <td>北陀镇汉墓的铜人吊灯</td>
                            <td>7.5</td>
                        </tr>
                        <tr>
                            <td>5</td>
                            <td>广西宋代的纺织技术</td>

                        <tr>
                            <td>6</td>
                            <td>广西古代的矿冶技术</td>
                            <td>6.5</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.3.2/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
    <!-- 删除原来的广西省地图 -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/echarts/map/js/province/guangxi.js"></script> -->

    <!-- 引入高德地图 API -->
    <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=a8dad1da6df32d5e626e8ddcc8a1a7de"></script>

    <script>
        // 定义vintage主题的调色板
        const colorPalette = [
            '#d87c7c',
            '#919e8b',
            '#d7ab82',
            '#6e7074',
            '#61a0a8',
            '#efa18d',
            '#787464',
            '#cc7e63',
            '#724e58',
            '#4b565b'
        ];

        // 初始化所有图表
        const timelineChart = echarts.init(document.getElementById('timelineChart'));
        const pieChart = echarts.init(document.getElementById('pieChart'));
        const barChart = echarts.init(document.getElementById('barChart'));
        const scatterChart = echarts.init(document.getElementById('scatterChart'));
        const trendChart = echarts.init(document.getElementById('trendChart'));

        // 初始化高德地图
        let amap = new AMap.Map('map', {
            zoom: 7.5, // 缩放级别
            center: [108.320004, 22.82402], // 广西省中心点（南宁）
            resizeEnable: true, // 允许调整大小
            viewMode: '3D', // 使用3D视图
            pitch: 35, // 俯仰角度
            mapStyle: 'amap://styles/whitesmoke', // 浅色样式
            showIndoorMap: false, // 不显示室内地图
            features: ['bg', 'road'], // 只显示背景和道路
            showBuildingBlock: false // 不显示建筑物
        });
        
        // 创建广西省行政区实例
        AMap.plugin('AMap.DistrictLayer', function() {
            // 创建行政区图层
            let guangxiLayer = new AMap.DistrictLayer.Province({
                zIndex: 12,
                adcode: ['450000'], // 广西省行政编码
                depth: 2, // 显示市级行政区
                styles: {
                    'fill': 'rgba(254, 248, 239, 0.6)', // 填充颜色
                    'province-stroke': '#d7ab82', // 省边界颜色
                    'city-stroke': 'rgba(215, 171, 130, 0.5)', // 市边界颜色
                    'county-stroke': 'rgba(215, 171, 130, 0.2)' // 区县边界颜色
                }
            });
            
            // 添加行政区图层到地图
            guangxiLayer.setMap(amap);
            
            // 添加地市标记
            const cities = [
                { name: '南宁市', location: [108.320004, 22.82402], value: 920 },
                { name: '柳州市', location: [109.411703, 24.314617], value: 880 },
                { name: '桂林市', location: [110.299121, 25.274215], value: 940 },
                { name: '梧州市', location: [111.297604, 23.474803], value: 750 },
                { name: '北海市', location: [109.119254, 21.473343], value: 820 },
                { name: '防城港市', location: [108.345478, 21.614631], value: 700 },
                { name: '钦州市', location: [108.624229, 21.967127], value: 710 },
                { name: '贵港市', location: [109.602146, 23.0936], value: 730 },
                { name: '玉林市', location: [110.154393, 22.63136], value: 760 },
                { name: '百色市', location: [106.616285, 23.897742], value: 670 },
                { name: '贺州市', location: [111.552056, 24.414141], value: 640 },
                { name: '河池市', location: [108.062105, 24.695899], value: 620 },
                { name: '来宾市', location: [109.229772, 23.733766], value: 600 },
                { name: '崇左市', location: [107.353926, 22.404108], value: 580 }
            ];
            
            // 城市科技信息
            let scienceInfo = {
                '南宁市': '省会城市，壮族医药传统技术保存完好，铜鼓铸造工艺代表',
                '柳州市': '工业重镇，蒸汽机车制造业发达，传统冶炼技术先进',
                '桂林市': '喀斯特地貌研究中心，古代水利工程发达，造纸术传承基地',
                '梧州市': '岭南传统医药研究地，古代造船业中心',
                '北海市': '海洋资源利用技术发达，古代珍珠养殖技术发源地',
                '防城港市': '古代港口贸易中心，海盐晒制工艺代表区',
                '钦州市': '陶瓷制作工艺保存区，坭兴陶技艺代表',
                '贵港市': '古代水运枢纽，传统纺织技术发达',
                '玉林市': '传统中医药发展中心，天然药材加工基地',
                '百色市': '少数民族传统农耕技术保存区，梯田水利工程典范',
                '贺州市': '古代采矿冶炼基地，传统建筑技术保存完好',
                '河池市': '古代金银矿冶炼中心，壮族天文历法传承地',
                '来宾市': '传统农业技术发达，少数民族手工技艺丰富',
                '崇左市': '边境贸易中心，壮族医药和建筑技术代表区'
            };
            
            // 为每个城市添加标记
            cities.forEach(city => {
                // 创建标记
                let marker = new AMap.Marker({
                    position: city.location,
                    title: city.name,
                    label: {
                        content: city.name,
                        direction: 'top',
                        offset: new AMap.Pixel(0, -5),
                        style: {
                            color: '#724e58',
                            fontSize: '12px',
                            fontWeight: 'bold',
                            padding: '3px 6px',
                            backgroundColor: 'rgba(254, 248, 239, 0.8)',
                            borderRadius: '3px'
                        }
                    },
                    icon: new AMap.Icon({
                        size: new AMap.Size(20, 20),
                        image: 'https://webapi.amap.com/theme/v1.3/markers/n/mark_r.png',
                        imageSize: new AMap.Size(20, 20)
                    })
                });
                
                // 创建信息窗体
                let infoWindow = new AMap.InfoWindow({
                    content: `<div style="padding:10px;font-family:'楷体',KaiTi;">
                                <h3 style="margin:0;color:#724e58;">${city.name}</h3>
                                <p style="margin:5px 0;">发展指数：${city.value}</p>
                                <p style="margin:5px 0;">${scienceInfo[city.name] || ''}</p>
                             </div>`,
                    offset: new AMap.Pixel(0, -30)
                });
                
                // 点击标记时打开信息窗体
                marker.on('click', function() {
                    infoWindow.open(amap, marker.getPosition());
                });
                
                amap.add(marker);
            });
            
            // 设置地图显示范围为广西省
            amap.setCity('广西壮族自治区');
        });
        
        // 添加适合的控件
        amap.plugin(['AMap.Scale'], function() {
            amap.addControl(new AMap.Scale());
        });

        // 修改时间轴配置
        const timelineOption = {
            //title: {
            //   text: '历史科技成就时间轴',
            //    left: 'center',
            //     top: 5,
            //      textStyle: {
            //          color: '#724e58',
            //          fontSize: 14
            //     }
            // },
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'cross',
                    label: {
                        backgroundColor: '#724e58'
                    }
                }
            },
            legend: {
                data: ['农学', '医学', '数学', '工程技术'],
                top: '-2%',
                right: '10%',
                itemWidth: 10,        // 减小宽度使其成为圆点
                itemHeight: 10,       // 保持相同的高度使其成为圆形
                itemStyle: {
                    borderRadius: 5   // 设置为宽度/高度的一半，使其成为完美的圆
                },
                itemGap: 16,
                textStyle: {
                    color: '#724e58',
                    fontSize: 14,
                    padding: [3, 0, 0, 0]
                }
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                top: '15%',
                containLabel: true
            },
            xAxis: [{
                type: 'category',
                boundaryGap: false,
                data: ['夏', '商', '周', '秦', '汉', '唐', '宋'],
                axisLabel: {
                    color: '#724e58'
                },
                axisLine: {
                    lineStyle: {
                        color: '#724e58'
                    }
                }
            }],
            yAxis: [{
                type: 'value',
                name: '',  // 移除y轴名称
                interval: 100,  // 设置刻度间隔为100
                max: 200,      // 设置最大值为200
                axisLabel: {
                    color: '#724e58',
                    formatter: function (value) {
                        // 只显示100和200的刻度值
                        return value === 100 || value === 200 ? value : '';
                    }
                },
                axisLine: {
                    lineStyle: {
                        color: '#724e58'
                    }
                },
                splitLine: {
                    lineStyle: {
                        color: 'rgba(114, 78, 88, 0.1)',
                        type: 'dashed'
                    }
                }
            }],
            series: [
                {
                    name: '农学',
                    type: 'line',
                    stack: '总量',
                    smooth: true,
                    showSymbol: false,  // 隐藏数据点
                    areaStyle: {
                        color: colorPalette[1],
                        opacity: 1
                    },
                    data: [12, 20, 18, 26, 28, 31, 30],
                    itemStyle: {
                        color: colorPalette[1],
                        borderRadius: 10
                    }
                },
                {
                    name: '医学',
                    type: 'line',
                    stack: '总量',
                    smooth: true,
                    showSymbol: false,  // 隐藏数据点
                    areaStyle: {
                        color: colorPalette[2],
                        opacity: 1
                    },
                    data: [20, 17, 13, 18, 22, 25, 32],
                    itemStyle: {
                        color: colorPalette[2],
                        borderRadius: 10
                    }
                },
                {
                    name: '数学',
                    type: 'line',
                    stack: '总量',
                    smooth: true,
                    showSymbol: false,  // 隐藏数据点
                    areaStyle: {
                        color: colorPalette[3],
                        opacity: 1
                    },
                    data: [38, 34, 30, 32, 36, 27, 29],
                    itemStyle: {
                        color: colorPalette[3],
                        borderRadius: 10
                    }
                },
                {
                    name: '工程技术',
                    type: 'line',
                    stack: '总量',
                    smooth: true,
                    showSymbol: false,  // 隐藏数据点
                    areaStyle: {
                        color: colorPalette[4],
                        opacity: 1
                    },
                    data: [65, 70, 78, 73, 80, 75, 68],
                    itemStyle: {
                        color: colorPalette[4],
                        borderRadius: 10
                    }
                }
            ]
        };

        // 修改饼图配置
        const pieOption = {
            tooltip: {
                trigger: 'item'
            },
            series: [{
                type: 'pie',
                radius: '70%',
                data: [
                { value: 50, name: '农业科技' },  // 广西是农业大省，农业科技发展迅速
                { value: 45, name: '食品科技' },  // 食品加工业是广西的重要产业
                { value: 40, name: '旅游科技' },  // 广西旅游业发达，旅游科技发展较快
                { value: 35, name: '能源科技' },  // 广西能源资源丰富，能源科技发展较快
                { value: 30, name: '交通科技' },  // 广西是交通枢纽，交通科技发展迅速
                { value: 25, name: '生态科技' },  // 广西生态资源丰富，生态科技逐渐受到重视
                { value: 20, name: '信息技术' }   // 信息技术产业正在快速发展
                ],
                label: {
                    color: '#724e58'
                },
                color: colorPalette
            }]
        };

        // 修改柱状图配置
        const barOption = {
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'shadow'
                },
                position: function (point, params, dom, rect, size) {
                    // 限制tooltip显示在图表的右上角区域
                    return ['50%', '10%'];  // 固定在右上角区域
                },
                extraCssText: 'z-index: 100000 !important; pointer-events: all !important;'
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                top: '15%',  // 增加顶部间距，给tooltip留出更多空间
                containLabel: true
            },
            legend: {
                data: ['天文学', '农学', '医学', '地理学', '工程技术'],
                textStyle: {
                    color: '#724e58'
                }
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            xAxis: {
